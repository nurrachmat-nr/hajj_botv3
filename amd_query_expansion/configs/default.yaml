# Default configuration matching the paper's reported experimental setup.

llm:
  backend: hf                                # hf | openai | mock
  model_name: Qwen/Qwen2.5-7B-Instruct
  temperature: 0.7
  max_new_tokens: 256

dense_retriever:
  model_name: intfloat/multilingual-e5-base

pipeline:
  relevance_threshold: 0.4
  original_query_weight: 1

retrieval:
  fusion: rrf                                # sparse | dense | rrf
  rrf_k: 60
  depth: 1000

evaluation:
  beir_datasets:
    - trec-covid
    - nfcorpus
    - fiqa
    - scifact
    - scidocs
    - webis-touche2020
  trec_dl_datasets:
    - trec-dl-2019
    - trec-dl-2020
  beir_top_k: 10
  trec_dl_top_k: 10
  trec_dl_recall_k: 1000
